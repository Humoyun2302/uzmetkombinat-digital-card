[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/content.json"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
for = "/*.png"
  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.vcf"
  [headers.values]
  Content-Type = "text/vcard; charset=utf-8"
  Content-Disposition = "attachment; filename=\"abdullayev.vcf\""
