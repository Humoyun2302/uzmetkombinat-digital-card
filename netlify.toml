[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/*.vcf"
  [headers.values]
  Content-Type = "text/vcard; charset=utf-8"
  Content-Disposition = "attachment; filename=\"abdullayev.vcf\""
